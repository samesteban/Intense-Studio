# Supabase configuration for Intense Studio.
#
# Hand-authored minimal config — there is no linked Supabase project yet and
# no CLI scaffold was available, so only the sections this app needs are
# present. The full generated file can be produced later with `supabase init`
# and merged over this one. Reference:
# https://supabase.com/docs/guides/cli/config

# Placeholder project id. Replace with the real project ref when the project
# is created/linked (`supabase link --project-ref <ref>`).
project_id = "intense-studio"

# --- Key posture (design decision 5 — publishable key only) ----------------
# This app authenticates to the Data API with the PUBLISHABLE (anon) key via
# VITE_SUPABASE_PUBLISHABLE_KEY. The secret / service_role key MUST NEVER be
# shipped in the client bundle — it would be publicly exposed.
# Access control is delegated to RLS with permissive anon policies; that is
# documented security debt (the key acts as a bearer credential) and is
# expected to be tightened to owner_id tenancy when Auth is adopted.

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]

[db]
enabled = true
port = 54322

[auth]
enabled = true

[storage]
enabled = true
